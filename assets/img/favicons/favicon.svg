<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <style>
    .bg { fill: #6b8f71; }   /* light: 세이지 그린 배경 (사이트 액센트) */
    .fg { fill: #f2f8f4; }   /* light: 밝은 크림그린 글자 */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1d1e18; } /* dark: 딥 차콜 배경 */
      .fg { fill: #aad2ba; } /* dark: 밝은 민트 글자 */
    }
  </style>
  <rect class="bg" width="512" height="512" rx="104"/>
  <text class="fg" x="50%" y="52%" dominant-baseline="central" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="600"
        font-size="300">m</text>
</svg>
