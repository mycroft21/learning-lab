title: learning-lab
description: mycroft — 백엔드 개발자가 일하고 배운 것을 정리하는 공간
theme: minima

header_pages:
    - posts.md
    - about.md

markdown: kramdown
permalink: /:year/:month/:day/:title/

collections:
    posts:
        output: true

defaults:
    - scope:
          path: ""
          type: posts
      values:
          layout: post

exclude:
    - README.md
    - Gemfile
    - Gemfile.lock
