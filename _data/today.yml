        text: "코스피가 전 거래일보다 124.01포인트(1.76%) 내린 6909.91에 마감하며 7000선이 무너졌다. 원/달러 환율은 1345.9원으로 상승 마감했다."
        url: "https://view.asiae.co.kr/article/2026091115361397997"

