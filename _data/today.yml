        text: "이란혁명수비대(IRGC)가 호르무즈 해협에서 미국 선박 2척과 유조선 8척 등 총 10척을 공격했다고 밝혔다. 미군이 전날 이란 유조선 5척을 공격한 데 대한 보복으로, 요르단 주둔 미군기지에도 탄도미사일 20발이 발사돼 이 중 18발이 요격됐다."
