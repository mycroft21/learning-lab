        text: "미국 8월 근원 CPI가 전월 대비 0.3% 올라 시장 예상치(0.2%)를 웃돌았다(전년 대비 2.4%). CME 페드워치 기준 9월 FOMC 금리 인상 확률이 전날 72.4%에서 86.3%로 급등했고, 블룸버그는 금리 선물에 최대 90%까지 반영됐다고 보도했다."
