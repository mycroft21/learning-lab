      - source: 파이낸셜뉴스
        text: "미국-이란 전쟁이 홍해까지 번지며 국제유가가 배럴당 100달러를 돌파했다. 브렌트유는 3.93% 오른 101.8달러, WTI는 3.25% 오른 96.05달러에 거래됐다."
        url: "https://www.fnnews.com/news/202609091828556453"
