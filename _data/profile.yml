profile:
  name: mycroft
  role: 백엔드 개발자
  experience: 경력 8년 8개월
  summary: >
    SI, 온라인 광고, HR SaaS, PG사까지 서로 다른 도메인에서 서비스를 개발해 왔습니다.
    새로운 환경에 빠르게 적응하고, 익숙해지면 구조적인 문제를 찾아 개선하는 일을 즐기는 편입니다.
    심리학을 전공한 덕분인지, 기능을 구현하기 전에 실제 사용자가 어떤 흐름으로 사용할지를
    먼저 확인하려고 합니다. 백엔드 개발자지만 화면 설계나 사용자 흐름에 대해서도 의견을
    자주 제안하는 편이고, 그게 때로는 요구사항 자체를 다시 정의하는 계기가 되기도 합니다.

working_style:
  - >
    기술적인 방향을 제안하고 실제 구현까지 이어온 경험이 여러 번 있습니다. 플랫폼마다
    세션을 새로 구현하던 인증 구조를 공유 방식으로 전환하자고 제안해 직접 설계하고
    협업으로 구현했습니다.
  - >
    단일 SQL 구조를 재구성하고 조회·집계 로직을 분리해 응답 성능을 개선한 경험, 조회
    전용 구조를 제안해 개선을 진행한 경험이 있습니다.
  - >
    코드 리뷰 기준과 Git 브랜치 전략을 정리해 신규 입사자도 동일한 방식으로 개발할 수
    있는 환경을 만들고, 프로젝트마다 달라지던 개발 방식을 공통 컨벤션으로 정리해 팀에
    공유하는 역할을 하고 있습니다.
  - >
    레거시가 많은 환경에서 오래 일하다 보니 생긴 원칙이 있습니다. 한 번에 다 바꾸려
    하지 않고, 다음 사람이 이어서 개선할 수 있는 기반을 남기는 데 집중합니다. 기존
    서버 렌더링 구조를 API 서버와 프론트엔드로 분리한 것도, 지금 당장의 개선보다
    향후 프레임워크 교체가 가능한 구조를 만들어두는 데 목적이 있었습니다.

interests:
  - title: 레거시 뜯어보기
    body: 새로 짜는 것보다 이미 돌아가는 걸 왜 이렇게 짜놨는지 파헤치는 게 더 재밌습니다.
  - title: 안 흔들리는 구조
    body: 헥사고날 아키텍처나 아키텍처 테스트처럼, 다음번엔 덜 흔들릴 만한 뼈대에 관심이 갑니다.
  - title: 보안
    body: 모의해킹 대응을 몇 번 겪고 나니 "이게 뚫리면 어떡하지"부터 생각하는 버릇이 생겼습니다.
  - title: 배포 자동화
    body: 수동 배포 시절을 오래 겪어서, CI/CD와 무중단 배포 얘기만 나오면 반갑습니다.
  - title: AI 에이전트 만들기
    body: 사이드로 이것저것 만들어보다 반쯤 실패한 경험도 정리해 뒀습니다.

